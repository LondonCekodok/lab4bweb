<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 4a - Question 2</title>
</head>
<body>

    <input type="text" id="userInput" placeholder="Enter a number">
    <button onclick="checkInput()">Check</button>

    <script>
        function checkInput() {

            const rawValue = document.getElementById("userInput").value;

            if (rawValue.trim() === "" || isNaN(rawValue)) {
                alert("Please insert a number!");
            } else {
                const number = Number(rawValue);
                if (number < 10) {
                    alert("The number is lower than 10");
                } else {
                    alert("The number is higher than 10");
                }
            }
        }
    </script>
</body>
</html>
